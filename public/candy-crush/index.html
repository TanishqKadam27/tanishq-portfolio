<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melt & Match - The Sweetest Puzzle Game</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[url('https://wallpapers.com/images/hd/candy-crush-saga-background-a8jkcqn32lawvzeo.jpg')] min-h-screen flex items-center justify-center font-sans">
    <div id="game-container" class="w-full max-w-md mx-auto">
        <!-- Main Menu -->
        <div id="main-menu" class="text-center p-8 rounded-3xl bg-white bg-opacity-90 shadow-xl backdrop-blur-sm">
            <h1 class="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-600 mb-6">
                Melt & Match
            </h1>
            <div class="space-y-4">
                <button onclick="startGame()" class="menu-item animation-delay-100 w-full py-4 px-6 rounded-xlhttps://img.freepik.com/free-vector/candy-land-background_107791-28237.jpg bg-gradient-to-r from-pink-400 to-purple-500 text-white font-bold text-xl shadow-lg hover:shadow-xl transition-all transform hover:scale-105">
                    Start Game
                </button>
                <div class="menu-item animation-delay-300 p-4 rounded-xl bg-gray-100">
                    <p class="text-gray-700 font-medium">High Score</p>
                    <p id="high-score" class="text-3xl font-bold text-purple-600">0</p>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Settings</h2>
                <div class="space-y-6">
                    <div>
                        <label class="flex items-center justify-between">
                            <span class="text-gray-700 font-medium">Sound Effects</span>
                            <div class="relative inline-block w-12 mr-2 align-middle select-none">
                                <input type="checkbox" name="sound-toggle" id="sound-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                                <label for="sound-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                            </div>
                            
                        </label>
                    </div>
                    <div>
                        <label class="text-gray-700 font-medium block mb-2">Volume</label>
                        <input type="range" min="0" max="100" value="70" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div class="flex gap-3">
                        <button onclick="playTestSound()" class="w-1/2 py-3 px-6 rounded-xl bg-green-500 text-white font-bold text-lg shadow hover:shadow-md transition">
                            Test Sound
                        </button>
                        <button onclick="hideSettings()" class="w-1/2 py-3 px-6 rounded-xl bg-purple-500 text-white font-bold text-lg shadow hover:shadow-md transition">
                            Save & Back
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class=" hidden p-4 rounded-3xl bg-white bg-opacity-90 shadow-xl backdrop-blur-sm">
            <div class="flex justify-between items-center mb-4">
                <div class="text-xl font-bold text-purple-600">Score: <span id="score">0</span></div>
                <div class="text-xl font-bold text-pink-500">Time: <span id="timer">120</span>s</div>
            </div>
            <div id="game-board" class="grid grid-cols-8 gap-1 bg-gray-100 p-2 rounded-xl"></div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over" class="hidden text-center p-8 rounded-3xl bg-white bg-opacity-90 shadow-xl backdrop-blur-sm">
            <h2 class="text-4xl font-bold text-pink-600 mb-2">Game Over!</h2>
            <div class="text-2xl mb-6">
                <p class="text-gray-700">Your Score: <span id="final-score" class="font-bold text-purple-600">0</span></p>
                <p id="high-score-message" class="text-xl font-bold text-pink-500 hidden">🎉 New High Score! 🎉</p>
            </div>
            <div class="space-y-4">
                <button onclick="restartGame()" class="w-full py-4 px-6 rounded-xl bg-gradient-to-r from-pink-400 to-purple-500 text-white font-bold text-xl shadow-lg hover:shadow-xl transition">
                    Play Again
                </button>
                <button onclick="backToMenu()" class="w-full py-4 px-6 rounded-xl bg-gray-200 text-gray-700 font-bold text-xl shadow hover:shadow-md transition">
                    Back to Menu
                </button>
            </div>
        </div>
    </div>

    <script src="app.js">
    </script>
</body>
</html>
